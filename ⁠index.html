<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Gastos e Inversiones</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        @media print {
            .print\:hidden { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const DEFAULT_CATEGORIES = [
            { id: '1', name: 'Vivienda & Servicios', budget: 250000, color: '#3b82f6', icon: '🏠' },
            { id: '2', name: 'Alimentación & Mercado', budget: 180000, color: '#10b981', icon: '🛒' },
            { id: '3', name: 'Transporte', budget: 60000, color: '#f59e0b', icon: '🚗' },
            { id: '4', name: 'Entretenimiento & Ocio', budget: 50000, color: '#ec4899', icon: '🎬' },
            { id: '5', name: 'Salud & Bienestar', budget: 40000, color: '#06b6d4', icon: '💊' },
            { id: '6', name: 'Fondo de Ahorro', budget: 100000, color: '#8b5cf6', icon: '🐖' }
        ];

        const INITIAL_TRANSACTIONS = [
            { id: 't1', type: 'income', amount: 750000, categoryId: '', description: 'Salario Mensual', date: new Date().toISOString().split('T')[0], dueDate: '', accountType: 'bank' },
            { id: 't2', type: 'expense', amount: 220000, categoryId: '1', description: 'Pago de Alquiler y Luz', date: new Date().toISOString().split('T')[0], dueDate: new Date(Date.now() + 86400000).toISOString().split('T')[0], accountType: 'bank' }
        ];

        const INITIAL_SALES = [
            { id: 's1', client: 'Carlos Rodríguez', phone: '88888888', product: 'Refrigeradora LG', purchasePrice: 180000, salePrice: 240000, payDate: new Date(Date.now() - 86400000 * 2).toISOString().split('T')[0], status: 'pending' },
            { id: 's2', client: 'María Alvarado', phone: '87654321', product: 'Lote de Ropa Casual', purchasePrice: 35000, salePrice: 60000, payDate: new Date().toISOString().split('T')[0], status: 'pending' }
        ];

        const INITIAL_LOANS = [
            { 
                id: 'l1', 
                client: 'Juan Pérez', 
                phone: '88888888',
                amount: 100000, 
                interestRate: 10, 
                payDate: new Date(Date.now() - 86400000 * 2).toISOString().split('T')[0], 
                status: 'pending',
                payments: [
                    { id: 'p1', amount: 20000, date: new Date().toISOString().split('T')[0], note: 'Abono Inicial', receipt: null }
                ]
            }
        ];

        const INITIAL_NOTES = [
            { id: 'n1', title: 'Recordatorio Proveedores', content: 'Llamar a distribuidora de electrodomésticos el viernes.', date: new Date().toISOString().split('T')[0] }
        ];

        function App() {
            const [appPassword, setAppPassword] = useState(() => localStorage.getItem('app_user_password') || '');
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            
            const [inputPin, setInputPin] = useState('');
            const [authError, setAuthError] = useState('');
            const [showPinText, setShowPinText] = useState(false);

            const [showChangePassModal, setShowChangePassModal] = useState(false);
            const [newPassInput, setNewPassInput] = useState('');

            const [activeTab, setActiveTab] = useState('balance');

            const [accounts, setAccounts] = useState(() => {
                try {
                    const saved = localStorage.getItem('app_accounts_v3');
                    return saved ? JSON.parse(saved) : { cash: 150000, bank: 450000 };
                } catch (e) {
                    return { cash: 150000, bank: 450000 };
                }
            });

            const [categories, setCategories] = useState(() => {
                try {
                    const saved = localStorage.getItem('app_categories_v3');
                    return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
                } catch (e) {
                    return DEFAULT_CATEGORIES;
                }
            });

            const [transactions, setTransactions] = useState(() => {
                try {
                    const saved = localStorage.getItem('app_transactions_v3');
                    return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
                } catch (e) {
                    return INITIAL_TRANSACTIONS;
                }
            });

            const [sales, setSales] = useState(() => {
                try {
                    const saved = localStorage.getItem('app_sales_v3');
                    return saved ? JSON.parse(saved) : INITIAL_SALES;
                } catch (e) {
                    return INITIAL_SALES;
                }
            });

            const [loans, setLoans] = useState(() => {
                try {
                    const saved = localStorage.getItem('app_loans_v3');
                    return saved ? JSON.parse(saved) : INITIAL_LOANS;
                } catch (e) {
                    return INITIAL_LOANS;
                }
            });

            const [notes, setNotes] = useState(() => {
                try {
                    const saved = localStorage.getItem('app_notes_v3');
                    return saved ? JSON.parse(saved) : INITIAL_NOTES;
                } catch (e) {
                    return INITIAL_NOTES;
                }
            });

            const [selectedMonth, setSelectedMonth] = useState(() => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            });

            useEffect(() => { localStorage.setItem('app_user_password', appPassword); }, [appPassword]);
            useEffect(() => { localStorage.setItem('app_accounts_v3', JSON.stringify(accounts)); }, [accounts]);
            useEffect(() => { localStorage.setItem('app_categories_v3', JSON.stringify(categories)); }, [categories]);
            useEffect(() => { localStorage.setItem('app_transactions_v3', JSON.stringify(transactions)); }, [transactions]);
            useEffect(() => { localStorage.setItem('app_sales_v3', JSON.stringify(sales)); }, [sales]);
            useEffect(() => { localStorage.setItem('app_loans_v3', JSON.stringify(loans)); }, [loans]);
            useEffect(() => { localStorage.setItem('app_notes_v3', JSON.stringify(notes)); }, [notes]);

            const formatCRC = (amount) => {
                return '₡' + Number(amount || 0).toLocaleString('es-CR', { maximumFractionDigits: 0 });
            };

            const totalLiquidity = useMemo(() => accounts.cash + accounts.bank, [accounts]);

            const monthStats = useMemo(() => {
                const monthTrans = transactions.filter(t => t.date && t.date.startsWith(selectedMonth));
                const totalIncome = monthTrans.filter(t => t.type === 'income').reduce((acc, t) => acc + Number(t.amount || 0), 0);
                const totalExpense = monthTrans.filter(t => t.type === 'expense').reduce((acc, t) => acc + Number(t.amount || 0), 0);
                return { totalIncome, totalExpense, balance: totalIncome - totalExpense };
            }, [transactions, selectedMonth]);

            const handleSetOrCreatePassword = (e) => {
                e.preventDefault();
                if (!inputPin.trim()) return;
                if (!appPassword) {
                    setAppPassword(inputPin.trim());
                    setIsAuthenticated(true);
                    setInputPin('');
                    setAuthError('');
                    alert("¡Contraseña creada con éxito!");
                } else {
                    if (inputPin.trim() === appPassword) {
                        setIsAuthenticated(true);
                        setInputPin('');
                        setAuthError('');
                    } else {
                        setAuthError('Contraseña incorrecta.');
                    }
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center items-center p-4">
                        <div className="max-w-sm w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-2xl">
                            <div className="text-center space-y-2">
                                <div className="inline-block p-4 bg-amber-500/10 border border-amber-500/20 rounded-2xl text-amber-400 text-2xl">
                                    ⚡
                                </div>
                                <h1 className="text-xl font-extrabold text-white">Control de Gastos e Inversiones</h1>
                                <p className="text-xs text-slate-400">
                                    {!appPassword ? '🔒 Crea una contraseña para asegurar tu cuenta' : '🔑 Ingresa tu contraseña'}
                                </p>
                            </div>

                            <form onSubmit={handleSetOrCreatePassword} className="space-y-4">
                                <div className="relative">
                                    <input 
                                        type={showPinText ? "text" : "password"}
                                        required 
                                        autoFocus
                                        placeholder={!appPassword ? "Crea tu Contraseña / PIN" : "Escribe tu Contraseña"}
                                        value={inputPin} 
                                        onChange={e => setInputPin(e.target.value)} 
                                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-center font-bold text-slate-100 text-lg focus:outline-none focus:border-amber-500"
                                    />
                                    <button 
                                        type="button" 
                                        onClick={() => setShowPinText(!showPinText)} 
                                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs font-bold"
                                    >
                                        {showPinText ? "Ocultar" : "Ver"}
                                    </button>
                                </div>

                                {authError && <p className="text-xs font-bold text-rose-400 text-center">{authError}</p>}

                                <button 
                                    type="submit" 
                                    className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3 rounded-2xl text-xs transition shadow-lg shadow-amber-500/20"
                                >
                                    {!appPassword ? '💾 Guardar Contraseña' : '🚀 Iniciar Sesión'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 print:hidden">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
                            <div>
                                <h1 className="text-lg font-bold text-white">Control de Gastos e Inversiones</h1>
                                <div className="flex items-center gap-3 text-xs text-slate-400 mt-0.5">
                                    <span className="text-emerald-400 font-bold">🟢 Sesión Protegida</span>
                                    <button onClick={() => setIsAuthenticated(false)} className="hover:text-rose-400 underline text-[11px]">
                                        🔒 Bloquear
                                    </button>
                                </div>
                            </div>

                            <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 flex-wrap gap-1 text-xs font-bold">
                                <button onClick={() => setActiveTab('balance')} className={`px-3 py-1.5 rounded-lg ${activeTab === 'balance' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>⚖️ Balance</button>
                                <button onClick={() => setActiveTab('personal')} className={`px-3 py-1.5 rounded-lg ${activeTab === 'personal' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>🏠 Gastos</button>
                            </div>

                            <button onClick={() => window.print()} className="bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-3 py-2 rounded-xl">
                                🖨️ PDF
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 space-y-6">
                        {activeTab === 'balance' && (
                            <section className="space-y-6">
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                                        <div className="text-emerald-400 text-xs font-bold uppercase">💵 Dinero en Efectivo</div>
                                        <p className="text-2xl font-bold text-white mt-2">{formatCRC(accounts.cash)}</p>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                                        <div className="text-sky-400 text-xs font-bold uppercase">🏦 Cuentas Bancarias</div>
                                        <p className="text-2xl font-bold text-white mt-2">{formatCRC(accounts.bank)}</p>
                                    </div>
                                    <div className="bg-gradient-to-br from-amber-500/10 via-slate-900 to-slate-900 border border-amber-500/30 p-5 rounded-2xl">
                                        <div className="text-amber-400 text-xs font-extrabold uppercase">💰 CAPITAL CONSOLIDADO TOTAL</div>
                                        <p className="text-3xl font-extrabold text-amber-400 mt-2">{formatCRC(totalLiquidity)}</p>
                                    </div>
                                </div>
                            </section>
                        )}

                        {activeTab === 'personal' && (
                            <section className="space-y-6">
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                        <p className="text-xs font-medium text-slate-400">Ingresos Totales</p>
                                        <p className="text-xl font-bold text-emerald-400 mt-1">{formatCRC(monthStats.totalIncome)}</p>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                        <p className="text-xs font-medium text-slate-400">Gastos Totales</p>
                                        <p className="text-xl font-bold text-rose-400 mt-1">{formatCRC(monthStats.totalExpense)}</p>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                        <p className="text-xs font-medium text-slate-400">Disponible Neto</p>
                                        <p className="text-xl font-bold text-sky-400 mt-1">{formatCRC(monthStats.balance)}</p>
                                    </div>
                                </div>
                            </section>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
